name: Materialize private-source migration payload
on:
  push:
    branches: [migration/full-independent-plugin]
    paths:
      - "migration/PAYLOAD_READY"
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/full-independent-plugin
          persist-credentials: true
      - name: Install xz utilities
        run: sudo apt-get update && sudo apt-get install -y xz-utils
      - name: Decompress and perform static migration checks
        shell: bash
        run: |
          set -euo pipefail
          cat migration/payload-part-1 migration/payload-part-2a migration/payload-part-3 migration/payload-part-4 migration/payload-part-5 > /tmp/independent-apps.b64
          base64 --decode /tmp/independent-apps.b64 > /tmp/independent-apps.plugin.xz
          xz -t /tmp/independent-apps.plugin.xz
          xz -dc /tmp/independent-apps.plugin.xz > /tmp/independent-apps.plugin
          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/independent-apps.plugin")
          s = p.read_text(encoding="utf-8")
          required = ["[Argument]", "[Rule]", "[Rewrite]", "[Script]", "[MITM]"]
          assert all(s.count(x) == 1 for x in required), "section structure mismatch"
          assert "XcvcvX/loon-change" not in s, "private source URL remains"
          assert "Script-Hub-Org_replace-header.js" not in s, "GitHub header rewrite remains"
          assert "github.com" not in s.split("[MITM]", 1)[1].lower(), "GitHub host in MITM"
          line = next(x for x in s.split("[MITM]", 1)[1].splitlines() if x.startswith("hostname = "))
          hosts = [x.strip() for x in line.split("=", 1)[1].split(",") if x.strip()]
          assert len(hosts) == len(set(hosts)), "duplicate MITM hosts"
          print("PASS static structure; bytes:", p.stat().st_size, "MITM hosts:", len(hosts))
          PY
          cp /tmp/independent-apps.plugin plugins/independent-apps.plugin
          python tools/check-script-assets.py
      - name: Commit plugin and remove temporary payload
        shell: bash
        run: |
          set -euo pipefail
          rm -f migration/payload-part-* migration/PAYLOAD_READY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/independent-apps.plugin migration/
          git commit -m "feat(plugin): migrate full independent app bundle"
          git push origin "HEAD:migration/full-independent-plugin"
