name: Validate plugin script assets
on:
  push:
    branches: [main, migration/full-independent-plugin]
    paths:
      - "plugins/**"
      - "scripts/**"
      - "tools/**"
      - "sources/**"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate bundle structure and anonymously fetch every active asset
        run: python tools/check-script-assets.py
